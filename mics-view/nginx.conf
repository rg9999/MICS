server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: unknown paths fall back to index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cesium ships large .wasm / model assets; let them cache hard.
    location ~* \.(js|css|wasm|glb|gltf|woff2?|png|jpg|jpeg|svg|ktx2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, so deploys take effect immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
