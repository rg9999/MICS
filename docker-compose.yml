# MICS headless run. One container hosts the full topology (ground station +
# attacker sim + N aircraft + monitor) over the default DDS transport.
#
# Pick a scenario at run time, e.g.:
#   docker compose run --rm mics ros2 launch mics_nodes mics.launch.py \
#       scenario:=/scenarios/evasive_reassign.yaml rate_factor:=2.0
services:
  mics:
    build:
      context: .
      dockerfile: Dockerfile
    image: mics:headless
    # scenarios are bind-mounted so they can be edited without a rebuild
    volumes:
      - ./scenarios:/scenarios:ro
    environment:
      - ROS_DOMAIN_ID=42
      # All nodes live in THIS container, so confine DDS discovery to loopback.
      # Without this, concurrent `docker compose run` containers share the
      # compose network + domain and cross-talk (multiple attacker_sims on one
      # /sim/clock), corrupting every run.
      - ROS_LOCALHOST_ONLY=1
      - RCUTILS_LOGGING_BUFFERED_STREAM=0

  # --- gazebo profile: physics-authoritative run on Gazebo Fortress (headless).
  # The image layers Fortress + ros_gz onto mics:headless, so build that first:
  #   docker compose build mics
  #   docker compose --profile gazebo run --rm mics-gazebo
  # Override the scenario like the `mics` service:
  #   docker compose --profile gazebo run --rm mics-gazebo \
  #       ros2 launch mics_nodes gazebo.launch.py scenario:=/scenarios/evasive_reassign.yaml
  mics-gazebo:
    build:
      context: .
      dockerfile: Dockerfile.gazebo
    image: mics:gazebo
    profiles: ["gazebo"]
    volumes:
      - ./scenarios:/scenarios:ro
    environment:
      - ROS_DOMAIN_ID=42
      - ROS_LOCALHOST_ONLY=1
      - RCUTILS_LOGGING_BUFFERED_STREAM=0
      # headless render backend; no GPU/display in this container
      - IGN_GAZEBO_RESOURCE_PATH=/gz/models

  # --- viewer profile: always-on sim-host orchestrator + ROS<->browser gateway.
  # Brought up with:  docker compose --profile viewer up
  #
  # Unlike the ephemeral `mics` runs above, these are singletons that must see
  # each other's topics, so they share ROS_DOMAIN_ID over the compose network
  # and DO NOT set ROS_LOCALHOST_ONLY. There is exactly one orchestrator (and
  # the one sim it launches as a child), so the concurrent-run cross-talk the
  # `mics` service guards against cannot occur here.
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: mics:headless
    profiles: ["viewer"]
    command: ["ros2", "launch", "mics_nodes", "orchestrator.launch.py",
              "catalog_dir:=/scenarios", "default_rtf:=2.0"]
    volumes:
      - ./scenarios:/scenarios:ro
    environment:
      - ROS_DOMAIN_ID=42
      - RCUTILS_LOGGING_BUFFERED_STREAM=0

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: mics:headless
    profiles: ["viewer"]
    command: ["python3", "-m", "viewer_gateway", "--source", "ros",
              "--config", "/config/gateway.yaml"]
    depends_on:
      - orchestrator
    ports:
      - "8080:8080"          # the single host port the browser connects to
    volumes:
      - ./scenarios:/scenarios:ro
      - ./viewer_gateway/gateway.example.yaml:/config/gateway.yaml:ro
      - mics-recordings:/recordings
    environment:
      - ROS_DOMAIN_ID=42
      - RCUTILS_LOGGING_BUFFERED_STREAM=0

  # Static frontend (nginx). The browser connects to it on :8088 and, from that
  # same page host, opens a WebSocket to the gateway on :8080.
  viewer-ui:
    build:
      context: ./mics-view
      dockerfile: Dockerfile
      target: prod
    image: mics-view:web
    profiles: ["viewer", "demo"]
    ports:
      - "8088:80"

  # --- demo profile: run the whole UI with NO ROS. The gateway runs its
  # synthetic fixture source, so `docker compose --profile demo up` brings up a
  # self-contained, browsable demo (UI on :8088, gateway on :8080).
  gateway-demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: mics:headless
    profiles: ["demo"]
    command: ["python3", "-m", "viewer_gateway", "--source", "fixture",
              "--config", "/config/gateway.yaml"]
    ports:
      - "8080:8080"
    volumes:
      - ./scenarios:/scenarios:ro
      - ./viewer_gateway/gateway.example.yaml:/config/gateway.yaml:ro
      - mics-recordings:/recordings

volumes:
  mics-recordings:
